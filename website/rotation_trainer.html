<!-- Dark-mode-aware volleyball Rotation Trainer. Paste this ENTIRE file
     into a single Squarespace CODE block (not Embed). Same theme-sync +
     toggle pattern as the other standalone pages on this site (see
     volunteer_page.html) since this plan doesn't have sitewide Code
     Injection.

     Purely educational, no scoring/streaks/leaderboards by design --
     an interactive court diagram that steps through all 6 rotations
     for the 5-1, 6-2, and 4-2 offensive systems (5-1 first/default,
     as the most commonly taught system), showing where each role
     stands (as an animated circle on a half-court background) and
     which setter is actively setting (or penetrating from the back
     row to do so). A Serving / Serve Receive toggle switches between
     two position models:

       - SERVING: the strict "overlap rule" formation -- front row
         must be closer to the net than the matching back-row player
         in the same column, and left-to-right order must hold within
         each row. This is a hard rule with one correct shape, so it's
         drawn as an even 2x3 grid.
       - SERVE RECEIVE: a widely-taught default shape -- outside
         hitters (plus whichever third back-row player) spread into a
         passing arc, the setter releases/hides toward the net, and
         the middles + opposite clear out of the passing lanes near
         the net or just behind it. Real teams add lateral hide spots
         and rotation-specific tweaks on top of this general shape;
         this widget teaches the underlying concept, not one exact
         team's playbook.

     Both position sets are pure functions of (role type, front/back
     row, zone column) with no per-rotation special-casing, so they
     apply correctly to all 3 systems x 6 rotations without needing 18
     hand-authored diagrams -- and the specific numbers were chosen so
     max(front-row depth) < min(back-row depth) and the three column
     x-positions never cross, which means the overlap rule can never
     be violated no matter which role lands in which zone.

     Substitution toggle (3 options): by default ("Libero Sub"),
     whichever middle blocker is currently back row is shown as the
     Libero instead (a distinct pink circle) -- the standard
     real-world pattern, since a middle pair is always exactly 3
     rotation-slots apart and therefore always has exactly one front,
     one back, so there's always exactly one Libero substitution
     active. The Libero is treated as a passer in serve receive (like
     an outside hitter), matching the classic "2 outsides + libero"
     passing arc. "No Subs" turns this off entirely -- everyone stays
     on court the whole rotation and plays back-row defense
     themselves. "DS Sub" adds a Defensive Specialist (a distinct teal
     circle) on top of the Libero, covering whichever back-row pin
     hitter is weakest at passing -- teams use a DS for either an
     outside hitter OR the opposite (5-1 only), never the setter. The
     Opposite/Setter pair also sits 3 rotation-slots apart, so on
     rotations where the Opposite (not the Setter) is back row, the DS
     covers the Opposite instead of the back-row outside hitter --
     always exactly one DS-eligible target, and it always gets a
     passer's spot on the court (never the Opposite's normal off-net
     "doesn't pass" position).

     Libero vs. DS, per real substitution rules: the Libero wears a
     different-colored jersey, gets unlimited free swaps that don't
     count against a team's substitution limit, but can never attack
     the ball above net height. A DS is an ordinary substitute (no
     jersey/attack restriction) that DOES count against the team's
     normal substitution limit every time it swaps in or out (15/set
     in NCAA Division I and USAV club play, 18/set in NCAA Division
     II/III and NFHS high school) -- which is why teams use it more
     sparingly than the libero, and why it's modeled here as an
     addition on top of the Libero rather than a replacement for it.

     Rotation model: each system has a fixed 6-role "starting lineup"
     (array index 0..5 = court positions P1..P6, where P1 = back-right,
     P2 = front-right, P3 = front-middle, P4 = front-left, P5 = back-
     left, P6 = back-middle). Rotation N is that array rotated left by
     N -- since winning a serve rotates every player one position
     clockwise (P2's occupant becomes the new P1, etc.), which is
     exactly a left-rotation of the position array. Verified against
     real volleyball rules before shipping: every one of the 18 states
     (3 systems x 6 rotations) has exactly one active setter, correct
     opposite-role pairing (setters/outsides/middles each split
     exactly 3 positions apart), and the right front-row hitter counts
     per system (4-2 always 2, 6-2 always 3, 5-1 alternates 2/3
     depending on where the setter is).

     PLEASE SANITY-CHECK THE VOLLEYBALL MECHANICS before publishing --
     written from general knowledge of these systems plus web research
     on serve-receive conventions, not sourced from an official
     rulebook or one specific team's diagrams, and you'll know
     immediately if anything here doesn't match how GOVB actually
     teaches these systems. -->

<div class="vb-rot-page">
  <div class="vb-rot-head">

    </button>
  </div>
  <p class="vb-rot-intro">See how a team's 6 players move through the rotation order under three common offensive systems, where they line up for serving vs. serve receive, and which setter is actually setting each time.</p>

  <div class="vb-rot-tabs" id="vb-rot-tabs"></div>
  <div class="vb-rot-info" id="vb-rot-info"></div>

  <div class="vb-rot-mode-toggle" id="vb-rot-sub-toggle"></div>
  <p class="vb-rot-mode-caption" id="vb-rot-sub-caption"></p>

  <p class="vb-rot-mode-caption" id="vb-rot-mode-caption"></p>

  <div class="vb-rot-court-wrap">
    <div class="vb-rot-net">NET</div>

    </div>

<script>
(function () {
  // ======================================================================
  // Rotation data model
  //
  // Court position indices 0..5 = P1..P6 (P1 back-right, P2 front-right,
  // P3 front-middle, P4 front-left, P5 back-left, P6 back-middle).
  // FRONT_ROW = indices 1,2,3 (P2,P3,P4).
  //
  // Each system's startingLineup is ONE valid arrangement satisfying the
  // real rule that role partners (the two setters, the two outsides, the
  // two middles) always sit exactly 3 rotation-slots apart. Rotation N
  // is that array rotated left by N, since winning a serve moves every
  // player one position clockwise (P2's occupant becomes the new P1,
  // etc.) -- exactly a left-rotation of the position array.
  // ======================================================================
  var FRONT_ROW = { 1: true, 2: true, 3: true }; // indices (P2,P3,P4)

  var ROLE_LABELS = {
    S: "Setter", S1: "Setter", S2: "Setter", Opp: "Opposite",
    OH1: "Outside", OH2: "Outside", MB1: "Middle", MB2: "Middle",
  };
  function roleClass(role) {
    if (role.indexOf("S") === 0) return "S";
    if (role.indexOf("Opp") === 0) return "Opp";
    if (role.indexOf("OH") === 0) return "OH";
    return "MB";
  }

  var SYSTEMS = {
    "5-1": {
      label: "5-1",
      startingLineup: ["S", "OH1", "MB1", "Opp", "OH2", "MB2"],
      setterRoles: ["S"],
      // The one setter always sets -- from the net when front row, or
      // penetrating forward when back row.
      setterBadge: function (isFront) { return isFront ? "setting" : "penetrating"; },
      info: "<b>5-1 &mdash; one setter, every rotation.</b> A single setter runs the whole offense, front row or back (penetrating when back row). The Opposite hits opposite the setter in the rotation. Because only one player ever sets, the team's sets stay the most consistent -- the trade-off is alternating between 3 front-row hitters (setter back row) and only 2 (setter front row).",
    },
    "6-2": {
      label: "6-2",
      startingLineup: ["S1", "OH1", "MB1", "S2", "OH2", "MB2"],
      setterRoles: ["S1", "S2"],
      // Whichever setter is BACK ROW penetrates forward to set; the
      // front-row setter plays as a 3rd front-row hitter that rotation.
      setterBadge: function (isFront) { return isFront ? "hitting" : "penetrating"; },
      info: "<b>6-2 &mdash; maximum attackers, more running.</b> Same 2-setter personnel as 4-2, but the back-row setter sprints forward to set (\"penetrates\") every time, freeing the front-row setter to hit instead. Always gives you 3 front-row attackers, at the cost of needing a setter who can reliably run in and set from off the net.",
    },
    "4-2": {
      label: "4-2",
      startingLineup: ["S1", "OH1", "MB1", "S2", "OH2", "MB2"],
      setterRoles: ["S1", "S2"],
      // Whichever setter is FRONT ROW sets from the net directly; the
      // back-row setter just plays normal back-row defense.
      setterBadge: function (isFront) { return isFront ? "setting" : ""; },
      info: "<b>4-2 &mdash; the simplest system.</b> 2 setters, positioned opposite each other so one is always in the front row. The front-row setter sets right where they stand; the back-row setter just plays defense. Easiest to learn, but always caps you at 2 front-row attackers since one front-row spot is used by the setter.",
    },
  };

  // ----------------------------------------------------------------------
  // Court coordinates (percent of the court box, x: 0=left sideline,
  // 100=right sideline; y: 0=net, 100=endline).
  //
  // SERVE: the overlap-rule formation. Front row sits at y=20, back row
  // at y=80 -- always closer to the net -- and the 3 columns sit at
  // x=17/50/83 left-to-right, so column and row order can never cross.
  // ----------------------------------------------------------------------
  var SERVE_POS = {
    0: { x: 83, y: 80 }, // P1
    1: { x: 83, y: 20 }, // P2
    2: { x: 50, y: 20 }, // P3
    3: { x: 17, y: 20 }, // P4
    4: { x: 17, y: 80 }, // P5
    5: { x: 50, y: 80 }, // P6
  };

  function zoneColumn(idx) {
    var x = SERVE_POS[idx].x;
    if (x < 33) return "left";
    if (x > 67) return "right";
    return "mid";
  }

  // SERVE RECEIVE: a role-based default shape, not tied to any one
  // specific rotation, so it applies correctly no matter which zone a
  // role ends up in:
  //   - Middles never pass -- crowd the net front row, tuck just behind
  //     the attack line back row, ready to release into the offense.
  //   - The setter never passes -- stands at the net front row (no
  //     hiding needed), or creeps up toward the front of their zone
  //     back row to shorten the sprint in to set.
  //   - The Opposite (5-1 only) never passes -- stays off the net,
  //     ready to transition into an attack approach.
  //   - Outside hitters ALWAYS pass. Front row they hang back slightly
  //     off the net; back row they spread wide toward their own
  //     sideline (or hold the middle-back spot), forming the classic
  //     3-player passing arc across the back row.
  //
  // Every front-row y (max 26) is less than every back-row y (min 38),
  // and the only lateral shift (back-row OH toward its sideline) only
  // ever pushes a wing position further from center while the middle
  // column stays put -- so left < mid < right always holds too. That
  // means this shape can never violate the overlap rule, regardless of
  // which role lands in which zone.
  function receivePos(idx, role, isFront) {
    var cls = roleClass(role);
    var cellX = SERVE_POS[idx].x;
    var x = cellX, y;

    if (cls === "MB") {
      y = isFront ? 6 : 38;
    } else if (cls === "S") {
      y = isFront ? 10 : 40;
    } else if (cls === "Opp") {
      y = isFront ? 12 : 55;
    } else { // OH -- the passer
      y = isFront ? 26 : 68;
      if (!isFront) {
        var col = zoneColumn(idx);
        if (col === "left") x = 6;
        else if (col === "right") x = 94;
        else x = 50;
      }
    }
    return { x: x, y: y };
  }

  var currentSystem = "5-1";
  var currentRotation = 0; // 0-5
  var currentMode = "serve"; // "serve" | "receive"
  var currentSubMode = "libero"; // "none" | "libero" | "ds"

  var MODES = [
    { key: "serve", label: "Serving" },
    { key: "receive", label: "Serve Receive" },
  ];
  var MODE_CAPTIONS = {
    serve: "At the moment of serve, all 6 players must sit in this exact left-right / front-back order &mdash; the overlap rule. This is the one legally-required shape.",
    receive: "A common serve-receive shape: outside hitters form a passing arc across the back row while the setter releases to the net and the middles/opposite clear out of the passing lanes. Real teams add their own lateral hide spots on top of this.",
  };

  var SUB_OPTIONS = [
    { key: "none", label: "No Subs" },
    { key: "libero", label: "Libero Sub" },
    { key: "ds", label: "DS Sub" },
  ];
  var SUB_CAPTIONS = {
    none: "No specialist substitutions &mdash; the starting lineup plays every rotation as-is, including back-row defense.",
    libero: "The Libero is a back-row defense/passing specialist (distinct jersey) who subs in for the middle blocker every time they rotate to the back row, then subs back out when that middle returns to the front row. Libero swaps are unlimited and free &mdash; they don't count against a team's substitution limit &mdash; but the Libero can never attack the ball above net height.",
    ds: "A Defensive Specialist is an ordinary substitute (no special jersey, no attack restriction) brought in for a weaker back-row passer &mdash; an outside hitter, or the opposite in 5-1 (never the setter, who has to stay on to run the offense) &mdash; alongside the Libero, then subbed back out at the front row. Unlike the Libero, every DS swap counts against the team's substitution limit (15/set in NCAA Division I and USAV club play, 18/set in NCAA Division II/III and NFHS high school), so teams use it more sparingly.",
  };

  function rotationState(systemKey, rotationIndex) {
    var lineup = SYSTEMS[systemKey].startingLineup;
    return lineup.slice(rotationIndex).concat(lineup.slice(0, rotationIndex));
  }

  var playerEls = {};
  var lastSystem = null;

  function ensurePlayers() {
    if (currentSystem === lastSystem) return;
    lastSystem = currentSystem;
    var court = document.getElementById("vb-rot-court");
    // Keep the attack-line, drop any previously-built player circles.
    var old = court.querySelectorAll(".vb-rot-player");
    for (var k = 0; k < old.length; k++) old[k].parentNode.removeChild(old[k]);
    playerEls = {};
    function addPlayer(key, cls, label, title) {
      var el = document.createElement("div");
      el.className = "vb-rot-player vb-rot-role-" + cls;
      el.title = title;
      el.innerHTML = '<span class="pos"></span><span class="role">' + label + '</span><span class="badge"></span>';
      court.appendChild(el);
      playerEls[key] = el;
    }
    SYSTEMS[currentSystem].startingLineup.forEach(function (role) {
      addPlayer(role, roleClass(role), role, ROLE_LABELS[role]);
    });
    // One persistent Libero circle and one persistent DS circle -- a
    // middle pair (and, separately, an outside hitter pair) always has
    // exactly one back-row member (they sit 3 rotation-slots apart),
    // so there's always exactly one of each substitution active when
    // that mode is selected. Each one just slides to whichever zone
    // its back-row teammate currently occupies.
    addPlayer("Libero", "L", "L", "Libero");
    addPlayer("DS", "DS", "DS", "Defensive Specialist");
  }

  function positionPlayers() {
    var sys = SYSTEMS[currentSystem];
    var roles = rotationState(currentSystem, currentRotation); // roles[idx] = role at zone idx
    var backMiddleIdx = -1, backMiddleRole = null;
    var backOHIdx = -1, backOHRole = null;
    var backOppIdx = -1, backOppRole = null;
    for (var idx = 0; idx < 6; idx++) {
      var role = roles[idx];
      var el = playerEls[role];
      var isFront = !!FRONT_ROW[idx];
      var pos = currentMode === "serve" ? SERVE_POS[idx] : receivePos(idx, role, isFront);
      el.style.left = pos.x + "%";
      el.style.top = pos.y + "%";
      el.style.display = "";
      el.querySelector(".pos").textContent = "P" + (idx + 1);
      var isSetter = sys.setterRoles.indexOf(role) >= 0;
      var badge = isSetter ? sys.setterBadge(isFront) : "";
      el.classList.toggle("setting", badge === "setting" || badge === "penetrating");
      el.querySelector(".badge").textContent = badge;
      var cls = roleClass(role);
      if (cls === "MB" && !isFront) {
        backMiddleIdx = idx;
        backMiddleRole = role;
      } else if (cls === "OH" && !isFront) {
        backOHIdx = idx;
        backOHRole = role;
      } else if (cls === "Opp" && !isFront) {
        backOppIdx = idx;
        backOppRole = role;
      }
    }

    // Libero substitution ("libero" or "ds" mode): a middle pair
    // always has exactly one back-row member, so backMiddleIdx is
    // always found here.
    var liberoEl = playerEls["Libero"];
    var liberoActive = (currentSubMode === "libero" || currentSubMode === "ds") && backMiddleIdx >= 0;
    if (liberoActive) {
      playerEls[backMiddleRole].style.display = "none";
      // The Libero passes like an outside hitter -- pass a stand-in
      // OH role name purely to select that branch of receivePos().
      var liberoPos = currentMode === "serve" ? SERVE_POS[backMiddleIdx] : receivePos(backMiddleIdx, "OH1", false);
      liberoEl.style.left = liberoPos.x + "%";
      liberoEl.style.top = liberoPos.y + "%";
      liberoEl.style.display = "";
      liberoEl.querySelector(".pos").textContent = "P" + (backMiddleIdx + 1);
      liberoEl.querySelector(".badge").textContent = "";
      liberoEl.classList.remove("setting");
    } else {
      liberoEl.style.display = "none";
    }

    // DS substitution ("ds" mode only, on top of the Libero): teams
    // use a DS for either a weak-passing outside hitter OR a weak-
    // passing opposite (5-1 only) -- never for the active setter, who
    // has to stay on to run the offense. The Opposite/Setter pair sits
    // 3 rotation-slots apart just like every other pair, so on the
    // rotations where the Opposite (not the Setter) is back row, that
    // takes priority for the single DS; otherwise it falls back to
    // whichever outside hitter is back row (the only candidate in
    // 4-2/6-2, which have no Opposite role at all). The DS passes like
    // an outside hitter regardless of which role it's covering -- pass
    // a stand-in OH role name to receivePos() so a covered Opposite
    // gets a passer's spot instead of the Opposite's normal off-net
    // "doesn't pass" position.
    var dsEl = playerEls["DS"];
    var dsTargetIdx = backOppIdx >= 0 ? backOppIdx : backOHIdx;
    var dsTargetRole = backOppIdx >= 0 ? backOppRole : backOHRole;
    var dsActive = currentSubMode === "ds" && dsTargetIdx >= 0;
    if (dsActive) {
      playerEls[dsTargetRole].style.display = "none";
      var dsPos = currentMode === "serve" ? SERVE_POS[dsTargetIdx] : receivePos(dsTargetIdx, "OH1", false);
      dsEl.style.left = dsPos.x + "%";
      dsEl.style.top = dsPos.y + "%";
      dsEl.style.display = "";
      dsEl.querySelector(".pos").textContent = "P" + (dsTargetIdx + 1);
      dsEl.querySelector(".badge").textContent = "";
      dsEl.classList.remove("setting");
    } else {
      dsEl.style.display = "none";
    }
  }

  function render() {
    var sys = SYSTEMS[currentSystem];

    // System tabs
    var tabsHtml = "";
    Object.keys(SYSTEMS).forEach(function (key) {
      tabsHtml += '<button class="vb-rot-tab' + (key === currentSystem ? " active" : "") +
        '" data-system="' + key + '">' + key + "</button>";
    });
    document.getElementById("vb-rot-tabs").innerHTML = tabsHtml;

    // Info card
    document.getElementById("vb-rot-info").innerHTML = sys.info;

    // Mode toggle
    var modeHtml = "";
    MODES.forEach(function (m) {
      modeHtml += '<button class="vb-rot-mode-btn' + (m.key === currentMode ? " active" : "") +
        '" data-mode="' + m.key + '">' + m.label + "</button>";
    });
    document.getElementById("vb-rot-mode-toggle").innerHTML = modeHtml;
    document.getElementById("vb-rot-mode-caption").innerHTML = MODE_CAPTIONS[currentMode];

    // Libero / DS substitution toggle
    var subHtml = "";
    SUB_OPTIONS.forEach(function (opt) {
      subHtml += '<button class="vb-rot-mode-btn' + (opt.key === currentSubMode ? " active" : "") +
        '" data-sub="' + opt.key + '">' + opt.label + "</button>";
    });
    document.getElementById("vb-rot-sub-toggle").innerHTML = subHtml;
    document.getElementById("vb-rot-sub-caption").innerHTML = SUB_CAPTIONS[currentSubMode];

    // Court
    ensurePlayers();
    positionPlayers();

    // Counter + dots
    document.getElementById("vb-rot-counter").textContent = "Rotation " + (currentRotation + 1) + " of 6";
    var dotsHtml = "";
    for (var i = 0; i < 6; i++) {
      dotsHtml += '<button class="vb-rot-dot' + (i === currentRotation ? " active" : "") + '" data-rot="' + i + '" aria-label="Rotation ' + (i + 1) + '"></button>';
    }
    document.getElementById("vb-rot-dots").innerHTML = dotsHtml;

    // Legend (role colors -- Libero/DS only shown when subbing is active)
    document.getElementById("vb-rot-legend").innerHTML =
      '<span><i class="vb-rot-role-S"></i>Setter</span>' +
      (currentSystem === "5-1" ? '<span><i class="vb-rot-role-Opp"></i>Opposite</span>' : "") +
      '<span><i class="vb-rot-role-OH"></i>Outside</span>' +
      '<span><i class="vb-rot-role-MB"></i>Middle</span>' +
      (currentSubMode === "none" ? "" : '<span><i class="vb-rot-role-L"></i>Libero</span>') +
      (currentSubMode === "ds" ? '<span><i class="vb-rot-role-DS"></i>DS</span>' : "");

    bindControls();
  }

  function bindControls() {
    var tabs = document.querySelectorAll(".vb-rot-tab");
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].onclick = function () {
        currentSystem = this.getAttribute("data-system");
        currentRotation = 0;
        render();
      };
    }
    var modeBtns = document.querySelectorAll("#vb-rot-mode-toggle .vb-rot-mode-btn");
    for (var m = 0; m < modeBtns.length; m++) {
      modeBtns[m].onclick = function () {
        currentMode = this.getAttribute("data-mode");
        render();
      };
    }
    var subBtns = document.querySelectorAll("#vb-rot-sub-toggle .vb-rot-mode-btn");
    for (var n = 0; n < subBtns.length; n++) {
      subBtns[n].onclick = function () {
        currentSubMode = this.getAttribute("data-sub");
        render();
      };
    }
    var dots = document.querySelectorAll(".vb-rot-dot");
    for (var j = 0; j < dots.length; j++) {
      dots[j].onclick = function () {
        currentRotation = +this.getAttribute("data-rot");
        render();
      };
    }
  }

  document.getElementById("vb-rot-prev").onclick = function () {
    currentRotation = (currentRotation + 5) % 6;
    render();
  };
  document.getElementById("vb-rot-next").onclick = function () {
    currentRotation = (currentRotation + 1) % 6;
    render();
  };

  render();

  // ---- Theme sync (identical pattern to every other standalone page) ----
  var THEME_TTL_MS = 5 * 60 * 1000;

  function prefersDark() {
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function storedTheme() {
    var stored = localStorage.getItem("vbcalTheme");
    var ts = +localStorage.getItem("vbcalThemeTS") || 0;
    if (stored && Date.now() - ts > THEME_TTL_MS) {
      localStorage.removeItem("vbcalTheme");
      localStorage.removeItem("vbcalThemeTS");
      return null;
    }
    return stored;
  }
  function touchThemeTS() {
    if (localStorage.getItem("vbcalTheme")) localStorage.setItem("vbcalThemeTS", String(Date.now()));
  }
  function currentDark() {
    var stored = storedTheme();
    return stored ? stored === "dark" : prefersDark();
  }
  function apply(dark) {
    document.body.classList.toggle("vb-dark-page", dark);
  }

  document.getElementById("vb-rot-theme").onclick = function () {
    var dark = !currentDark();
    localStorage.setItem("vbcalTheme", dark ? "dark" : "light");
    localStorage.setItem("vbcalThemeTS", String(Date.now()));
    apply(dark);
  };

  apply(currentDark());
  touchThemeTS();
  document.addEventListener("visibilitychange", function () { if (!document.hidden) touchThemeTS(); });
  setInterval(touchThemeTS, 60000);

  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    var onChange = function (e) {
      if (!storedTheme()) apply(e.matches);
    };
    if (mq.addEventListener) mq.addEventListener("change", onChange);
  }
  window.addEventListener("storage", function (e) {
    if (e.key === "vbcalTheme") apply(currentDark());
  });
})();
</script>
